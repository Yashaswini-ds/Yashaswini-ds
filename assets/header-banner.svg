<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#042f2e;stop-opacity:1" />
    </linearGradient>

    <!-- Teal Glow Gradient -->
    <radialGradient id="glow-1" cx="80%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="glow-2" cx="20%" cy="70%" r="35%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf" />
      <stop offset="50%" style="stop-color:#5eead4" />
      <stop offset="100%" style="stop-color:#2dd4bf" />
    </linearGradient>

    <!-- Code Symbol Gradient -->
    <linearGradient id="code-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:0.4" />
    </linearGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" />
  <rect width="1200" height="300" fill="url(#grid)" />
  <rect width="1200" height="300" fill="url(#glow-1)" />
  <rect width="1200" height="300" fill="url(#glow-2)" />

  <!-- Bottom border glow line -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#text-grad)" opacity="0.6"/>

  <!-- Decorative floating particles -->
  <circle cx="100" cy="50" r="2" fill="#2dd4bf" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;40;50" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="230" r="1.5" fill="#5eead4" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="230;220;230" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="80" r="1.8" fill="#2dd4bf" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="250" r="2.2" fill="#14b8a6" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="250;240;250" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="60" r="1.5" fill="#5eead4" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="200" r="2" fill="#2dd4bf" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;190;200" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="270" r="1.2" fill="#99f6e4" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1150" cy="120" r="1.8" fill="#2dd4bf" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Code brackets </> on the right side matching LinkedIn banner -->
  <g transform="translate(950, 80)" filter="url(#glow)" opacity="0.6">
    <text font-family="'Fira Code', 'Courier New', monospace" font-size="100" font-weight="300" fill="url(#code-grad)">
      &lt;/&gt;
    </text>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Small code symbols scattered -->
  <text x="80" y="120" font-family="'Fira Code', monospace" font-size="18" fill="#2dd4bf" opacity="0.15">{ }</text>
  <text x="180" y="260" font-family="'Fira Code', monospace" font-size="14" fill="#0d9488" opacity="0.12">const</text>
  <text x="850" y="270" font-family="'Fira Code', monospace" font-size="16" fill="#14b8a6" opacity="0.1">async</text>
  <text x="750" y="50" font-family="'Fira Code', monospace" font-size="12" fill="#2dd4bf" opacity="0.12">import</text>
  <text x="400" y="40" font-family="'Fira Code', monospace" font-size="14" fill="#0d9488" opacity="0.1">def</text>
  <text x="1100" y="280" font-family="'Fira Code', monospace" font-size="13" fill="#2dd4bf" opacity="0.1">( )</text>

  <!-- Binary / code rain effect columns -->
  <text x="320" y="20" font-family="monospace" font-size="10" fill="#2dd4bf" opacity="0.06">01101</text>
  <text x="320" y="35" font-family="monospace" font-size="10" fill="#2dd4bf" opacity="0.05">10010</text>
  <text x="320" y="50" font-family="monospace" font-size="10" fill="#2dd4bf" opacity="0.04">11011</text>

  <text x="620" y="230" font-family="monospace" font-size="10" fill="#14b8a6" opacity="0.05">01010</text>
  <text x="620" y="245" font-family="monospace" font-size="10" fill="#14b8a6" opacity="0.04">11100</text>
  <text x="620" y="260" font-family="monospace" font-size="10" fill="#14b8a6" opacity="0.03">00111</text>

  <!-- Main Name Text -->
  <text x="80" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="url(#text-grad)" filter="url(#soft-glow)">
    Yashaswini DS
  </text>

  <!-- Subtitle -->
  <text x="80" y="165" font-family="'Fira Code', 'Courier New', monospace" font-size="18" fill="#94a3b8" letter-spacing="1">
    Aspiring Data Science Student • Full-Stack Developer
  </text>

  <!-- Decorative line under subtitle -->
  <line x1="80" y1="180" x2="580" y2="180" stroke="url(#text-grad)" stroke-width="1" opacity="0.3"/>

  <!-- Tags -->
  <!-- Tag 1: Python -->
  <rect x="80" y="200" width="90" height="28" rx="14" fill="#0d9488" opacity="0.2"/>
  <rect x="80" y="200" width="90" height="28" rx="14" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
  <text x="125" y="219" font-family="'Fira Code', monospace" font-size="12" fill="#2dd4bf" text-anchor="middle">Python</text>

  <!-- Tag 2: NLP -->
  <rect x="185" y="200" width="70" height="28" rx="14" fill="#0d9488" opacity="0.2"/>
  <rect x="185" y="200" width="70" height="28" rx="14" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
  <text x="220" y="219" font-family="'Fira Code', monospace" font-size="12" fill="#2dd4bf" text-anchor="middle">NLP</text>

  <!-- Tag 3: Web Dev -->
  <rect x="270" y="200" width="95" height="28" rx="14" fill="#0d9488" opacity="0.2"/>
  <rect x="270" y="200" width="95" height="28" rx="14" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
  <text x="317" y="219" font-family="'Fira Code', monospace" font-size="12" fill="#2dd4bf" text-anchor="middle">Web Dev</text>

  <!-- Tag 4: Data Science -->
  <rect x="380" y="200" width="125" height="28" rx="14" fill="#0d9488" opacity="0.2"/>
  <rect x="380" y="200" width="125" height="28" rx="14" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
  <text x="442" y="219" font-family="'Fira Code', monospace" font-size="12" fill="#2dd4bf" text-anchor="middle">Data Science</text>

  <!-- Tag 5: ML -->
  <rect x="520" y="200" width="60" height="28" rx="14" fill="#0d9488" opacity="0.2"/>
  <rect x="520" y="200" width="60" height="28" rx="14" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
  <text x="550" y="219" font-family="'Fira Code', monospace" font-size="12" fill="#2dd4bf" text-anchor="middle">ML</text>

  <!-- Location + University info -->
  <text x="80" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64748b">
    📍 India &nbsp; • &nbsp; 🎓 GM University &nbsp; • &nbsp; 💼 Software Engineer Intern
  </text>

</svg>
